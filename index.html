<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Récap</title>

  <!-- Application web installable (§3 des specs) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d5c46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Récap">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="icon" href="icones/icone-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Connexion ------------------------------------------------------- -->
  <section id="vue-login" class="login" hidden>
    <div class="carte">
      <h1>Récap</h1>
      <p>Connectez-vous une fois : vous resterez connectée jusqu’à ce que vous vous déconnectiez vous-même.</p>
      <form id="form-login">
        <label>E-mail
          <input id="login-email" type="email" autocomplete="username" inputmode="email" required>
        </label>
        <label>Mot de passe
          <input id="login-mdp" type="password" autocomplete="current-password" required>
        </label>
        <button id="btn-login" class="btn" type="submit">Se connecter</button>
        <div id="msg-login" class="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <!-- Application ----------------------------------------------------- -->
  <section id="vue-app" class="appli" hidden>
    <!-- Barre haute : soit l'en-tête vert de l'accueil, soit une barre avec
         bouton retour. Chaque écran la remplit lui-même. -->
    <header id="barre" class="bar"></header>
    <div id="corps" class="bd"></div>
    <!-- Barre d'onglets : visible UNIQUEMENT sur Accueil, Mes congés, Menu. -->
    <nav id="tabbar" class="tabbar" hidden>
      <button type="button" data-onglet="accueil"><span class="i" aria-hidden="true">⌂</span>Accueil</button>
      <button type="button" data-onglet="conges"><span class="i" aria-hidden="true">☾</span>Mes congés</button>
      <button type="button" data-onglet="menu"><span class="i" aria-hidden="true">⋯</span>Menu</button>
    </nav>
  </section>

  <!-- Feuille en bas d'écran (saisie d'une journée, formulaires) -------- -->
  <div id="sheetwrap" class="sheetwrap" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Message éphémère -------------------------------------------------- -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Dépendance externe autorisée : client Supabase depuis un CDN ------- -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration (URL + clé publique) -------------------------------- -->
  <script src="config.js"></script>

  <!-- Traduction des échecs en français --------------------------------- -->
  <script src="js/messages.js"></script>

  <!-- Modules PURS du lot 1 — NON MODIFIÉS par ce lot -------------------- -->
  <script src="js/feries.js"></script>
  <script src="js/format.js"></script>
  <script src="js/engine.js"></script>

  <!-- Accès aux données, puis chaîne des mois (orchestration partagée) --- -->
  <script src="js/db.js"></script>
  <script src="js/chaine-mois.js"></script>

  <!-- Boîte à outils d'interface (aucun calcul métier) ------------------- -->
  <script src="js/ui-kit.js"></script>

  <!-- Écrans (lot 6) ---------------------------------------------------- -->
  <script src="js/ui-reouverture.js"></script>
  <script src="js/ui-accueil.js"></script>
  <script src="js/ui-enfant.js"></script>
  <script src="js/ui-document.js"></script>
  <script src="js/ui-conges.js"></script>
  <script src="js/ui-historique.js"></script>
  <script src="js/ui-contrat.js"></script>
  <script src="js/ui-menu.js"></script>
  <script src="js/ui-periode.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
