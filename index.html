<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Récap</title>

  <!-- Application web installable (§3 des specs) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d5c46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Récap">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="icon" href="icones/icone-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Connexion ------------------------------------------------------- -->
  <section id="vue-login" class="login" hidden>
    <div class="carte">
      <h1>Récap</h1>
      <p>Connectez-vous une fois : vous resterez connectée jusqu’à ce que vous vous déconnectiez vous-même.</p>
      <form id="form-login">
        <label>E-mail
          <input id="login-email" type="email" autocomplete="username" inputmode="email" required>
        </label>
        <label>Mot de passe
          <input id="login-mdp" type="password" autocomplete="current-password" required>
        </label>
        <button id="btn-login" class="btn" type="submit">Se connecter</button>
        <!-- Lot 14 — « Mot de passe oublié ». Le message de retour ne révèle
             JAMAIS si l'adresse existe : ce formulaire serait sinon un outil
             pour savoir qui possède un compte ici, et cette application
             contient les revenus d'une personne et les noms de quatre
             enfants. -->
        <button id="btn-oubli" class="lien-login" type="button">Mot de passe oublié</button>
        <div id="msg-login" class="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <!-- Application ----------------------------------------------------- -->
  <section id="vue-app" class="appli" hidden>
    <!-- Barre haute : soit l'en-tête vert de l'accueil, soit une barre avec
         bouton retour. Chaque écran la remplit lui-même. -->
    <header id="barre" class="bar"></header>
    <div id="corps" class="bd"></div>
    <!-- Barre d'onglets : visible UNIQUEMENT sur Accueil, Mes congés, Menu. -->
    <!-- LOT 22 §22.3 — QUATRE VRAIES ICÔNES SVG.

         Les quatre onglets portaient des caractères Unicode décoratifs :
         ⌂ ◷ ☾ ⋯. Ils ne s'affichent pas pareil d'un téléphone à l'autre —
         certains les rendent en emoji couleur, d'autres les remplacent par un
         rectangle vide, et « ◷ » manque à plusieurs polices système. Une barre
         de navigation dont les icônes changent de forme selon l'appareil n'est
         plus une barre de navigation.

         Les SVG sont EMBARQUÉS dans la page : aucune requête, aucune police
         d'icônes, rien à charger. Ils héritent de `currentColor`, donc l'état
         actif les colore sans règle supplémentaire. -->
    <nav id="tabbar" class="tabbar" hidden>
      <button type="button" data-onglet="accueil"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.2 12 4l9 7.2"/><path d="M5.5 9.8V20h13V9.8"/></svg></span>Accueil</button>
      <!-- Lot 8 : l'Historique devient un onglet racine. Il prend la deuxième
           position dans l'ordre de LECTURE — c'est le deuxième geste de Maria
           après consulter son mois — et absorbe le récapitulatif de période et
           les anciens contrats. La rubrique « Consulter » disparaît du Menu. -->
      <button type="button" data-onglet="historique"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><path d="M12 7.6V12l3 2.2"/></svg></span>Historique</button>
      <button type="button" data-onglet="conges"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 13.6A8.2 8.2 0 1 1 10.4 3.8a6.6 6.6 0 0 0 9.8 9.8z"/></svg></span>Mes congés</button>
      <button type="button" data-onglet="menu"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span>Menu</button>
    </nav>
  </section>

  <!-- Feuille en bas d'écran (saisie d'une journée, formulaires) -------- -->
  <div id="sheetwrap" class="sheetwrap" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Message éphémère -------------------------------------------------- -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Dépendance externe autorisée : client Supabase depuis un CDN ------- -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration (URL + clé publique) -------------------------------- -->
  <script src="config.js"></script>

  <!-- Traduction des échecs en français --------------------------------- -->
  <script src="js/messages.js"></script>

  <!-- Modules PURS du lot 1 — NON MODIFIÉS par ce lot -------------------- -->
  <script src="js/feries.js"></script>
  <script src="js/format.js"></script>
  <script src="js/engine.js"></script>

  <!-- Accès aux données, puis chaîne des mois (orchestration partagée) --- -->
  <script src="js/db.js"></script>
  <script src="js/chaine-mois.js"></script>

  <!-- Boîte à outils d'interface (aucun calcul métier) ------------------- -->
  <script src="js/ui-kit.js"></script>

  <!-- Écrans (lot 6) ---------------------------------------------------- -->
  <script src="js/ui-reouverture.js"></script>
  <script src="js/ui-accueil.js"></script>
  <script src="js/ui-enfant.js"></script>
  <script src="js/ui-document.js"></script>
  <script src="js/ui-conges.js"></script>
  <script src="js/ui-historique.js"></script>
  <script src="js/ui-contrat.js"></script>
  <!-- Lot 20 — l'écran de la période de familiarisation (§20.4 d). Après
       ui-contrat.js, qui est son point d'entrée. -->
  <script src="js/ui-familiarisation.js"></script>
  <script src="js/ui-menu.js"></script>
  <script src="js/ui-periode.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
