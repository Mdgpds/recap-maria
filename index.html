<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Récap</title>

  <!-- Application web installable (§3 des specs) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d5c46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Récap">
  <link rel="apple-touch-icon" href="icones/icone-192.png">
  <link rel="icon" href="icones/icone-192.png">

  <link rel="stylesheet" href="css/style.css?v=redesign-2a-feuille">
</head>
<body>

  <!-- Connexion ------------------------------------------------------- -->
  <section id="vue-login" class="login" hidden>
    <div class="carte">
      <h1>Récap</h1>
      <p>Connectez-vous une fois : vous resterez connectée jusqu’à ce que vous vous déconnectiez vous-même.</p>
      <form id="form-login">
        <label>E-mail
          <input id="login-email" type="email" autocomplete="username" inputmode="email" required>
        </label>
        <label>Mot de passe
          <input id="login-mdp" type="password" autocomplete="current-password" required>
        </label>
        <button id="btn-login" class="btn" type="submit">Se connecter</button>
        <!-- Lot 14 — « Mot de passe oublié ». Le message de retour ne révèle
             JAMAIS si l'adresse existe : ce formulaire serait sinon un outil
             pour savoir qui possède un compte ici, et cette application
             contient les revenus d'une personne et les noms de quatre
             enfants. -->
        <button id="btn-oubli" class="lien-login" type="button">Mot de passe oublié</button>
        <div id="msg-login" class="msg" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <!-- Application ----------------------------------------------------- -->
  <section id="vue-app" class="appli" hidden>
    <!-- Barre haute : soit l'en-tête vert de l'accueil, soit une barre avec
         bouton retour. Chaque écran la remplit lui-même. -->
    <header id="barre" class="bar"></header>
    <div id="corps" class="bd"></div>
    <!-- Barre d'onglets : visible UNIQUEMENT sur Accueil, Mes congés, Menu. -->
    <!-- LOT 22 §22.3 — QUATRE VRAIES ICÔNES SVG.

         Les quatre onglets portaient des caractères Unicode décoratifs :
         ⌂ ◷ ☾ ⋯. Ils ne s'affichent pas pareil d'un téléphone à l'autre —
         certains les rendent en emoji couleur, d'autres les remplacent par un
         rectangle vide, et « ◷ » manque à plusieurs polices système. Une barre
         de navigation dont les icônes changent de forme selon l'appareil n'est
         plus une barre de navigation.

         Les SVG sont EMBARQUÉS dans la page : aucune requête, aucune police
         d'icônes, rien à charger. Ils héritent de `currentColor`, donc l'état
         actif les colore sans règle supplémentaire. -->
    <!-- LA BARRE DES QUATRE ONGLETS (§2.1) — dans cet ordre :
         Mes enfants · Congés · Documents · Menu.

         L'ordre et les noms viennent de la maquette 2A. « Historique »
         disparaît : ce que Maria y cherchait — ses mois passés, ses documents,
         ses récapitulatifs de période — vit désormais sous « Documents », qui
         dit ce qu'on y trouve plutôt que quand ça s'est passé.

         LES ICÔNES RESTENT DES SVG EMBARQUÉS. La maquette dessine ses onglets
         avec des caractères Unicode (◍ ☾ ▤ •••) : ils ne s'affichent pas
         pareil d'un téléphone à l'autre — certains les rendent en emoji
         couleur, d'autres par un rectangle vide. C'est le défaut corrigé au
         lot 22, et le reprendre serait une régression. Les SVG héritent de
         `currentColor`, donc l'état actif les colore sans règle de plus. -->
    <nav id="tabbar" class="tabs" hidden>
      <button type="button" data-onglet="accueil"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.1"/></svg></span>Mes enfants</button>
      <button type="button" data-onglet="conges"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 13.6A8.2 8.2 0 1 1 10.4 3.8a6.6 6.6 0 0 0 9.8 9.8z"/></svg></span>Congés</button>
      <button type="button" data-onglet="docs"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.6" y="3.6" width="14.8" height="16.8" rx="2.2"/><path d="M8.2 8.4h7.6M8.2 12h7.6M8.2 15.6h4.6"/></svg></span>Documents</button>
      <button type="button" data-onglet="menu"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></span>Menu</button>
    </nav>
  </section>

  <!-- Feuille en bas d'écran (saisie d'une journée, formulaires) -------- -->
  <!-- REDESIGN 2A §5 — LA FEUILLE QUI MONTE DU BAS.
       Les classes viennent du socle (`sh` / `shb`) ; les identifiants ne
       changent pas — c'est par eux que `Kit.ouvrirFeuille` la trouve. -->
  <div id="sheetwrap" class="sh" hidden>
    <div id="sheet" class="shb" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Message éphémère -------------------------------------------------- -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Dépendance externe autorisée : client Supabase depuis un CDN ------- -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration (URL + clé publique) -------------------------------- -->
  <script src="config.js?v=redesign-2a-feuille"></script>

  <!-- Traduction des échecs en français --------------------------------- -->
  <script src="js/messages.js?v=redesign-2a-feuille"></script>

  <!-- Modules PURS du lot 1 — NON MODIFIÉS par ce lot -------------------- -->
  <script src="js/feries.js?v=redesign-2a-feuille"></script>
  <script src="js/format.js?v=redesign-2a-feuille"></script>
  <script src="js/engine.js?v=redesign-2a-feuille"></script>

  <!-- Accès aux données, puis chaîne des mois (orchestration partagée) --- -->
  <script src="js/db.js?v=redesign-2a-feuille"></script>
  <script src="js/chaine-mois.js?v=redesign-2a-feuille"></script>

  <!-- Boîte à outils d'interface (aucun calcul métier) ------------------- -->
  <script src="js/ui-kit.js?v=redesign-2a-feuille"></script>

  <!-- Écrans (lot 6) ---------------------------------------------------- -->
  <script src="js/ui-reouverture.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-accueil.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-enfant.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-document.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-conges.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-historique.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-contrat.js?v=redesign-2a-feuille"></script>
  <!-- Lot 20 — l'écran de la période de familiarisation (§20.4 d). Après
       ui-contrat.js, qui est son point d'entrée. -->
  <script src="js/ui-familiarisation.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-menu.js?v=redesign-2a-feuille"></script>
  <script src="js/ui-periode.js?v=redesign-2a-feuille"></script>

  <script src="js/app.js?v=redesign-2a-feuille"></script>
</body>
</html>
