<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Récap Maria</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Vue connexion ---------------------------------------------------- -->
  <section id="vue-login" class="vue-login" hidden>
    <div class="carte-login">
      <h1>Récap Maria</h1>
      <p class="aide">Connexion requise pour accéder à vos contrats.</p>
      <form id="form-login">
        <label>E-mail
          <input id="login-email" type="email" autocomplete="username" required>
        </label>
        <label>Mot de passe
          <input id="login-mdp" type="password" autocomplete="current-password" required>
        </label>
        <button id="btn-login" class="btn btn-primary btn-bloc" type="submit">Se connecter</button>
        <div id="msg-login" class="msg-login" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>

  <!-- Vue application -------------------------------------------------- -->
  <section id="vue-app" class="vue-app" hidden>
    <header class="entete">
      <span class="marque">Récap Maria</span>
      <button id="btn-logout" class="btn btn-lien" type="button">Se déconnecter</button>
    </header>
    <!-- État d'attente : occupe l'écran pendant le chargement, pour ne jamais
         afficher un onglet vide (correctif C1 du lot 5). -->
    <div id="chargement" class="chargement" role="status" aria-live="polite">Chargement…</div>
    <nav id="onglets" class="onglets" role="tablist" hidden>
      <button id="onglet-recap" class="onglet onglet-actif" type="button" role="tab">Récap</button>
      <button id="onglet-saisie" class="onglet" type="button" role="tab">Saisie</button>
      <button id="onglet-periode" class="onglet" type="button" role="tab">Période</button>
      <button id="onglet-familles" class="onglet" type="button" role="tab">Familles</button>
    </nav>
    <main id="recap" class="saisie" hidden></main>
    <main id="saisie" class="saisie" hidden></main>
    <main id="periode" class="saisie" hidden></main>
    <main id="familles" class="saisie" hidden></main>
    <footer class="pied">
      <small>Saisie par exception — les jours non modifiés sont présumés « présence ». Fériés pré-remplis.</small>
    </footer>
  </section>

  <!-- Dépendance externe autorisée : client Supabase depuis un CDN ----- -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration (URL + clé publique) ------------------------------- -->
  <script src="config.js"></script>

  <!-- Modules purs du lot 1 utilisés par la saisie et le récap --------- -->
  <script src="js/feries.js"></script>
  <script src="js/format.js"></script>
  <script src="js/engine.js"></script>

  <!-- Accès aux données, puis chaîne des mois (orchestration partagée) -- -->
  <script src="js/db.js"></script>
  <script src="js/chaine-mois.js"></script>

  <!-- Écrans : saisie (lot 3), récap (lot 4), période et familles (lot 5) -->
  <script src="js/ui-saisie.js"></script>
  <script src="js/ui-recap.js"></script>
  <script src="js/ui-periode.js"></script>
  <script src="js/ui-familles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
